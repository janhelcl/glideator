<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parra-Glideator flight seasonality</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1d2622;
      --muted: #52615a;
      --border: #d5e2da;
      --focus: #216751;
      font: 14px/1.4 system-ui, sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --text: #edf6f0;
      --muted: #b7c8bf;
      --border: #4b6055;
      --focus: #8fdbb9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); }
    main { padding: 12px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
    h1 { margin: 0; font-size: 1.3rem; overflow-wrap: anywhere; }
    #context { margin: 2px 0 0; color: var(--muted); }
    label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    select {
      min-height: 36px;
      padding: 4px 6px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .chart { width: 100%; max-width: 750px; height: 350px; margin: 0 auto; }
    svg { display: block; width: 100%; height: 100%; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 id="site">Parra-Glideator</h1>
        <p id="context" role="status">Loading seasonality…</p>
      </div>
      <label id="control" hidden>Threshold <select id="metric"></select></label>
    </header>
    <div class="chart" hidden><svg id="seasonality"></svg></div>
  </main>
  <!-- WIDGET_SCRIPT -->
</body>
</html>
