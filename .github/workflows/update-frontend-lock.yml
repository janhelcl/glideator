name: Update frontend lockfile

on:
  push:
    branches:
      - agent/refactor-frontend-data-loading
    paths:
      - frontend/package.json
      - .github/workflows/update-frontend-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-frontend-data-loading

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package lock
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update frontend package lock"
          git push
