name: Generate frontend lockfile

on:
  pull_request:
    paths:
      - frontend/package.json
      - .github/workflows/generate-frontend-lock.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate package lock from scratch
        working-directory: frontend
        run: |
          rm package-lock.json
          npm install --package-lock-only

      - name: Commit package lock
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Refresh frontend package lock"
          git push
