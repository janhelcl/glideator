task: xc

data:
  source: database
  database_url_env: ML_DATABASE_URL
  table: glideator_fs.features_with_target
  start_date: "2021-01-01"
  max_site_id: 250
  split_strategy: temporal
  train_end: "2023-12-31"
  eval_start: "2024-01-01"
  eval_end: "2024-12-31"
  require_known_eval_sites: true
  site_features:
    - latitude
    - longitude
    - altitude

model:
  name: expanded-production-reference
  seed: 42
  deterministic: true
  device: auto
  num_launches: 251
  site_embedding_dim: 32
  deep_hidden_units: [128, 64, 32]
  cross_layers: 2
  prediction_head_type: multilabel
  parallel_deep_hidden_units: null
  share_cross_net: true
  batch_size: 2048
  num_workers: 0
  learning_rate: 0.001
  lr_decay: 1.0
  epochs: 100
  patience: 10
  l1_lambda: 1.0e-9
  l2_lambda: 1.0e-9
  monotonicity_lambda: 1.0e-9

evaluation:
  benchmark_id: xc-temporal-2024-v1
  batch_size: 4096
  onnx_parity_sample_sizes: [1, 7, 31]
  onnx_parity_atol: 1.0e-5
  onnx_parity_rtol: 1.0e-5

artifact:
  output_dir: outputs/xc/production-reference
  filename: xc_checkpoint.pt
  export_onnx: true
  onnx_filename: model.onnx
  onnx_opset_version: 18

tracking:
  enabled: true
  experiment_name: glideator-xc
  tracking_uri_env: MLFLOW_TRACKING_URI
  default_tracking_uri: sqlite:///mlruns/mlflow.db
