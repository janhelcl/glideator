task: xc

data:
  source: database
  database_url_env: ML_DATABASE_URL
  table: glideator_fs.features_with_target
  start_date: "2021-01-01"
  max_site_id: 250
  split_strategy: temporal
  train_end: "2023-12-31"
  eval_start: "2024-01-01"
  eval_end: "2024-11-30"
  require_known_eval_sites: true
  require_eval_boundary_coverage: true
  site_features: [latitude, longitude, altitude]
  site_context_path: data/xc/jev_site_context_prod_2026-09-21.json

model:
  name: xc-jev-1.13-raw-prod-sites
  version: jev-1.13.0
  api_key_env: TYPESAFE_API_KEY
  prompt_version: xc-raw-weather-prod-sites-v2
  state_representation: raw-weather-prod-sites-v2
  validation_start: "2023-01-01"
  context_policy: fit_parity
  historical_prior_strength: 20.0
  concurrency: 8
  requests_per_minute: 900
  timeout_seconds: 60
  max_retries: 5
  backoff_initial_seconds: 0.5
  backoff_max_seconds: 30.0

evaluation:
  benchmark_id: xc-temporal-2024-jan-nov-v1

artifact:
  output_dir: outputs/xc/baselines/jev-1.13-raw-prod-sites

tracking:
  enabled: true
  experiment_name: glideator-xc
  run_name: xc-jev-1.13-raw-prod-sites
  tracking_uri_env: MLFLOW_TRACKING_URI
  default_tracking_uri: sqlite:///mlruns/mlflow.db
