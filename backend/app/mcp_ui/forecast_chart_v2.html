<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parra-Glideator flight activity forecast</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1d2622;
      --muted: #52615a;
      --border: #d5e2da;
      --focus: #216751;
      font: 14px/1.4 system-ui, sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --text: #edf6f0;
      --muted: #b7c8bf;
      --border: #4b6055;
      --focus: #8fdbb9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); }
    main { padding: 12px; }
    h1 { margin: 0; font-size: 1.3rem; overflow-wrap: anywhere; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 16px;
      margin-top: 8px;
    }
    label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    select {
      min-height: 36px;
      padding: 4px 6px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .charts { display: grid; gap: 8px 24px; margin-top: 8px; }
    .chart { position: relative; min-width: 0; height: 280px; }
    svg { width: 100%; height: 100%; display: block; overflow: visible; }
    #detail { margin: 6px 0 0; font-weight: 600; }
    .note { margin: 6px 0 0; color: var(--muted); font-size: .86rem; }
    [hidden] { display: none !important; }
    @media (min-width: 900px) {

      .chart { height: 400px; }

  <main>
    <h1 id="site">Parra-Glideator</h1>
    <div id="controls" class="controls" hidden>
      <label>Date <select id="date"></select></label>
      <label>Threshold <select id="metric"></select></label>
    </div>
    <div id="charts" class="charts" hidden>
      <div class="chart"><svg id="flight-quality"></svg></div>
